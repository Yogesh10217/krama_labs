apiVersion: apps/v1
kind: Deployment
metadata:
  name: krama-backend
  labels:
    app: krama-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: krama-backend
  template:
    metadata:
      labels:
        app: krama-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: backend
        image: krama-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: krama-secrets
        - configMapRef:
            name: krama-config
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
